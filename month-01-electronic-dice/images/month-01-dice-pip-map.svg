<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="DejaVu Sans, Verdana, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="14" y="26" font-size="16" font-weight="bold">Dice pip map: which LED is which pin</text>
<rect x="40" y="46" width="230" height="250" rx="26" fill="#fafafa" stroke="#333" stroke-width="3"/>
<circle cx="75" cy="90" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="75" y="94" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D1</text>
<circle cx="235" cy="90" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="235" y="94" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D2</text>
<circle cx="75" cy="170" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="75" y="174" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D3</text>
<circle cx="155" cy="170" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="155" y="174" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D4</text>
<circle cx="235" cy="170" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="235" y="174" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D5</text>
<circle cx="75" cy="250" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="75" y="254" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D6</text>
<circle cx="235" cy="250" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="235" y="254" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">D7</text>
<text x="300" y="80" font-size="13" font-weight="bold">LED order along the breadboard row</text>
<text x="300" y="106" font-size="13">1. top left = <tspan font-weight="bold">D1</tspan> (chip pin 2)</text>
<text x="300" y="132" font-size="13">2. top right = <tspan font-weight="bold">D2</tspan> (chip pin 3)</text>
<text x="300" y="158" font-size="13">3. mid left = <tspan font-weight="bold">D3</tspan> (chip pin 4)</text>
<text x="300" y="184" font-size="13">4. centre = <tspan font-weight="bold">D4</tspan> (chip pin 5)</text>
<text x="300" y="210" font-size="13">5. mid right = <tspan font-weight="bold">D5</tspan> (chip pin 6)</text>
<text x="300" y="236" font-size="13">6. bottom left = <tspan font-weight="bold">D6</tspan> (chip pin 7)</text>
<text x="300" y="262" font-size="13">7. bottom right = <tspan font-weight="bold">D7</tspan> (chip pin 8)</text>
</svg>