<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="DejaVu Sans, Verdana, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/>
<text x="14" y="26" font-size="16" font-weight="bold">Dice pip map: which LED is which pin</text>
<rect x="40" y="46" width="230" height="250" rx="26" fill="#fafafa" stroke="#333" stroke-width="3"/>
<circle cx="95" cy="100" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="95" y="104" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC0</text>
<circle cx="95" cy="180" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="95" y="184" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC1</text>
<circle cx="95" cy="260" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="95" y="264" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC2</text>
<circle cx="175" cy="180" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="175" y="184" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC3</text>
<circle cx="255" cy="100" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="255" y="104" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC4</text>
<circle cx="255" cy="180" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="255" y="184" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC5</text>
<circle cx="255" cy="260" r="24" fill="#d32f2f" stroke="#7a1010" stroke-width="2"/>
<text x="255" y="264" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">RC6</text>
<text x="300" y="80" font-size="13" font-weight="bold">LED order along the breadboard row</text>
<text x="300" y="106" font-size="13">1. top left = <tspan font-weight="bold">RC0</tspan> (chip pin 11)</text>
<text x="300" y="132" font-size="13">2. mid left = <tspan font-weight="bold">RC1</tspan> (chip pin 12)</text>
<text x="300" y="158" font-size="13">3. bottom left = <tspan font-weight="bold">RC2</tspan> (chip pin 13)</text>
<text x="300" y="184" font-size="13">4. centre = <tspan font-weight="bold">RC3</tspan> (chip pin 14)</text>
<text x="300" y="210" font-size="13">5. top right = <tspan font-weight="bold">RC4</tspan> (chip pin 15)</text>
<text x="300" y="236" font-size="13">6. mid right = <tspan font-weight="bold">RC5</tspan> (chip pin 16)</text>
<text x="300" y="262" font-size="13">7. bottom right = <tspan font-weight="bold">RC6</tspan> (chip pin 17)</text>
</svg>