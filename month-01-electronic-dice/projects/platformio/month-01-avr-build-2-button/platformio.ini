; PlatformIO project for the ATmega328P (internal 1 MHz oscillator, factory fuses).
; Choose the environment that matches your programmer. Build: the tick; upload: the arrow.
; 'framework = arduino' is only here so PlatformIO knows how to build; our own main() runs instead of Arduino's.
[platformio]
default_envs = usbasp

; Global Values.
[env]
framework = arduino
platform = atmelavr
board = ATmega328P

; Use this environment with USBASP for the ATmega328P with the internal 1 MHz oscillator and factory fuses.
[env:usbasp]
board_build.f_cpu = 1000000L
upload_protocol = usbasp
upload_flags =
    -Pusb
    -B10
    -e

; Use this environment to burn the fuses for the internal 1 MHz oscillator. 
; This is a one-time operation.
[env:usbasp_internal]
board_build.f_cpu = 1000000L
upload_protocol = usbasp
upload_flags =
    -Pusb
    -B10
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFF

; Use this Environment if using and Arduio Uno R3 running the ArduinoISP example as a programmer.
; This is slower than using a USBasp, but it works if you don't have one.
[env:uno_isp]
; an Arduino Uno R3 running the ArduinoISP example, used as a programmer
board_build.f_cpu = 1000000L
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
