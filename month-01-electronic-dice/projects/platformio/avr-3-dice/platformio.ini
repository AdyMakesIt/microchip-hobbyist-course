; PlatformIO project for the ATmega328P (internal 1 MHz oscillator, factory fuses).
; Choose the environment that matches your programmer. Build: the tick; upload: the arrow.
[platformio]
default_envs = usbasp

[env:usbasp]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 1000000L
upload_protocol = usbasp
upload_flags =
    -Pusb
    -B10

[env:uno_isp]
; an Arduino Uno R3 running the ArduinoISP example, used as a programmer
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 1000000L
upload_protocol = stk500v1
upload_port = COM3   ; change to your Uno's port (Linux/macOS: /dev/ttyACM0)
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
