<text x="348" y="160" font-size="14" fill="#fff" text-anchor="middle">notch (or dot) at the LEFT</text>
<text x="40" y="288" font-size="13">Hold the chip with the notch on the left. Pin 1 is the bottom-left pin (next to the dot).</text>
<text x="40" y="308" font-size="13">Numbers run right along the bottom, then back left along the top. (Example: a 16-pin chip.)</text>
